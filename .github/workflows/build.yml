name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
    # On job level so that the step's `if` can see it; a fork's pull request
    # gets no secrets, and the analysis then stays dormant.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs the history: without it every line looks new.
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-SNAPSHOT ]]; then echo "is_snapshot=true"; else echo "is_snapshot=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Reuses the compiled classes, test results and JaCoCo XML of the build.
      - name: Analyse with SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --no-daemon

      # Counts, failures and durations on the run's summary page, every run.
      # annotate_only keeps it off the Checks API, so contents: read suffices.
      - name: Summarise test results
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce  # v6.7.1
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true

      # The reports are only worth opening while the run is recent.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/spotbugs/
            build/reports/jacoco/
          retention-days: 3
          compression-level: 9
          if-no-files-found: ignore

  # A push of a version without -SNAPSHOT to main releases it. Versions on Maven
  # Central can never be removed or replaced; a mistake needs a new version.
  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.outputs.is_snapshot == 'false'
    permissions:
      contents: write
    # Only this job sees the signing key: it runs on a push to main, never for a
    # pull request.
    env:
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Refuse to release an existing version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists - raise the version in gradle.properties."
            exit 1
          fi

      - name: Prepare release notes from the changelog
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $1 == "##" && $2 == version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section '## ${VERSION}' in CHANGELOG.md"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      # Uploads and lets Central validate; the release itself is a click in the
      # Central Portal (Deployments) until a first version went through cleanly.
      # Then switch to publishAndReleaseToMavenCentral, as in zs-identity.
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          body_path: release-notes.md

      - name: Bump version to next patch SNAPSHOT
        env:
          CURRENT: ${{ needs.build.outputs.version }}
        run: |
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version format for the auto bump: $CURRENT"
            exit 1
          fi
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          echo "Bump version: $CURRENT -> $NEXT"
          sed -i "s/^version=.*/version=${NEXT}/" gradle.properties
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Bump version to ${NEXT} [skip ci]"
          git push origin HEAD:main
